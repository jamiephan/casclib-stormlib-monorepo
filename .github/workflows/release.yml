name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g., casclib/v1.0.0 or stormlib/v0.0.0-dev.3)'
        required: true
        type: string
      npm_tag:
        description: 'NPM distribution tag'
        required: true
        type: choice
        options:
          - latest
          - dev
        default: latest
      dry_run:
        description: 'Dry run: build everything and pack the tarball, but do not publish, commit, tag, or release'
        required: false
        type: boolean
        default: false

# Default to read-only; the publish job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  validate:
    name: Validate Tag and Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only allow running on master branch
    if: github.ref == 'refs/heads/master'
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate tag format and npm tag consistency
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          NPM_TAG: ${{ inputs.npm_tag }}
        run: |
          echo "Validating tag: $TAG"

          # Validate tag format (casclib/v* or stormlib/v*)
          if [[ ! "$TAG" =~ ^(casclib|stormlib)/v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "::error::Tag must be in format 'casclib/vX.Y.Z' or 'stormlib/vX.Y.Z'"
            echo "Examples: casclib/v1.0.0, stormlib/v2.1.0-beta.1"
            exit 1
          fi

          VERSION="${TAG#*/v}"

          # Prerelease versions must not be published as `latest`, and vice versa —
          # publishing a prerelease to `latest` would push it to every `npm install`.
          if [[ "$VERSION" =~ [+-] ]]; then
            if [[ "$NPM_TAG" == "latest" ]]; then
              echo "::error::Prerelease version $VERSION cannot be published with npm tag 'latest'. Use 'dev'."
              exit 1
            fi
          else
            if [[ "$NPM_TAG" != "latest" ]]; then
              echo "::error::Stable version $VERSION must be published with npm tag 'latest', not '$NPM_TAG'."
              exit 1
            fi
          fi

          echo "✓ Tag format and npm tag validation passed"

      - name: Check if tag already exists
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "Checking if tag $TAG already exists..."

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "::error::Tag $TAG already exists on remote"
            exit 1
          fi

          echo "✓ Tag $TAG does not exist, safe to create"

      - name: Parse tag components
        id: parse
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Extract package name (casclib or stormlib)
          PACKAGE="${TAG%%/*}"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

          # Extract version (remove 'v' prefix)
          VERSION="${TAG#*/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Detect if prerelease (contains - or +)
          if [[ "$VERSION" =~ [+-] ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Package: $PACKAGE"
          echo "Version: $VERSION"

      - name: Summary
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          NPM_TAG: ${{ inputs.npm_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### ✓ Validation Passed"
            echo ""
            echo "**Tag:** \`$TAG\`"
            echo "**NPM Tag:** \`$NPM_TAG\`"
            echo "**Dry run:** \`$DRY_RUN\`"
            echo ""
            echo "Package build will now begin. Tag will be created after successful npm publish."
          } >> "$GITHUB_STEP_SUMMARY"

  # Build prebuilds for all supported platforms
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: master
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        working-directory: packages/${{ needs.validate.outputs.package }}
        run: pnpm run build

      - name: Create prebuild
        working-directory: packages/${{ needs.validate.outputs.package }}
        run: pnpm run prebuild

      - name: Run tests
        working-directory: packages/${{ needs.validate.outputs.package }}
        run: pnpm test
        env:
          CI: true

      - name: Upload prebuild
        uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ runner.os }}-${{ matrix.arch }}
          path: packages/${{ needs.validate.outputs.package }}/prebuilds/**/*
          retention-days: 7
          if-no-files-found: error

  # Publish to npm with all prebuilds
  publish:
    name: Publish to npm and Create Tag
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # commit version bump, push tag, create release
      id-token: write       # npm provenance (OIDC trusted publishing)
      issues: write         # comment on released PRs
      pull-requests: write  # comment on released PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0  # Full history for tag lookup and release-note ranges
          submodules: recursive

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Update package.json version
        shell: bash
        working-directory: packages/${{ needs.validate.outputs.package }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          echo "✓ Updated package.json version to $VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        working-directory: packages/${{ needs.validate.outputs.package }}
        run: pnpm run build

      - name: Download all prebuilds
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: prebuilds-*

      - name: Organize prebuilds
        shell: bash
        env:
          PACKAGE: ${{ needs.validate.outputs.package }}
        run: |
          mkdir -p "packages/$PACKAGE/prebuilds"

          for artifact in artifacts/prebuilds-*; do
            if [ -d "$artifact" ]; then
              echo "Processing $artifact"
              cp -r "$artifact"/* "packages/$PACKAGE/prebuilds/"
            fi
          done

          echo "Available prebuilds:"
          find "packages/$PACKAGE/prebuilds" -name "*.node"

      - name: Verify prebuild completeness
        shell: bash
        env:
          PACKAGE: ${{ needs.validate.outputs.package }}
        run: |
          # Refuse to publish a package missing any platform we claim to support —
          # a partial artifact download would otherwise ship silently.
          MISSING=0
          for platform in linux-x64 linux-arm64 win32-x64 win32-arm64 darwin-x64 darwin-arm64; do
            if ! ls "packages/$PACKAGE/prebuilds/$platform"/*.node >/dev/null 2>&1; then
              echo "::error::Missing prebuild for $platform"
              MISSING=1
            else
              echo "✓ $platform"
            fi
          done
          exit $MISSING

      - name: Update npm
        # OIDC trusted publishing with provenance requires a recent npm
        run: npm install -g npm@latest

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        working-directory: packages/${{ needs.validate.outputs.package }}
        run: npm publish --provenance --access public --tag ${{ inputs.npm_tag }}

      - name: Pack tarball (dry run)
        if: ${{ inputs.dry_run }}
        working-directory: packages/${{ needs.validate.outputs.package }}
        run: npm pack

      - name: Upload tarball (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: packages/${{ needs.validate.outputs.package }}/*.tgz
          retention-days: 7

      - name: Commit version bump, create and push tag
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          PACKAGE: ${{ needs.validate.outputs.package }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ inputs.tag }}
        run: |
          git add "packages/$PACKAGE/package.json"
          git commit -m "chore: [AUTOMATION] Bump $PACKAGE to v$VERSION"
          git tag "$TAG"
          git push origin master
          git push origin "$TAG"
          echo "✓ Pushed version bump commit and tag: $TAG"

      - name: Find previous tags and released PRs
        id: history
        shell: bash
        env:
          PACKAGE: ${{ needs.validate.outputs.package }}
          CURRENT: ${{ inputs.tag }}
        run: |
          git fetch --tags --force

          # Latest stable (non-prerelease) tag for this package — baseline for release notes
          PREV_STABLE=$(git tag -l "$PACKAGE/v*" --sort=-version:refname | grep -E "^${PACKAGE}/v[0-9]+\.[0-9]+\.[0-9]+$" | grep -v "^${CURRENT}$" | head -n 1 || true)
          # Latest tag of any kind for this package — baseline for PR comments,
          # so PRs already announced in a prior dev release are not commented twice
          PREV_ANY=$(git tag -l "$PACKAGE/v*" --sort=-version:refname | grep -v "^${CURRENT}$" | head -n 1 || true)

          echo "previous_tag=$PREV_STABLE" >> "$GITHUB_OUTPUT"
          echo "Previous stable tag: ${PREV_STABLE:-<none>}"
          echo "Previous tag (any): ${PREV_ANY:-<none>}"

          # PRs merged since the previous tag that touched this package or the upstream submodules
          if [ -n "$PREV_ANY" ]; then
            RANGE="$PREV_ANY..HEAD"
          else
            RANGE="HEAD"
          fi
          PR_NUMBERS=$(git log "$RANGE" --format=%s -- "packages/$PACKAGE" thirdparty .github scripts \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -un | head -n 10 | tr '\n' ' ' || true)

          echo "pr_numbers=$PR_NUMBERS" >> "$GITHUB_OUTPUT"
          echo "PRs included in this release: ${PR_NUMBERS:-<none>}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: '@jamiephan/${{ needs.validate.outputs.package }} v${{ needs.validate.outputs.version }}'
          draft: false
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          previous_tag: ${{ steps.history.outputs.previous_tag }}
          body: |
            ${{ needs.validate.outputs.is_prerelease == 'true' && '⚠️ **This is a prerelease version**' || '' }}

            ## Installation
            ```bash
            npm install @jamiephan/${{ needs.validate.outputs.package }}@${{ needs.validate.outputs.version }}
            ```

            ${{ needs.validate.outputs.is_prerelease == 'true' && format('Or install with the npm tag: `npm install @jamiephan/{0}@{1}`', needs.validate.outputs.package, inputs.npm_tag) || '' }}

            ## Supported Platforms
            This release includes prebuilt N-API binaries for:
            - **Linux (x64, arm64)**
            - **Windows (x64, arm64)**
            - **macOS (x64, arm64)**

            If your platform is not listed, the package will build from source automatically.

            ## Documentation
            For usage instructions, please refer to the [README](https://github.com/jamiephan/casclib-stormlib-monorepo/blob/master/packages/${{ needs.validate.outputs.package }}/README.md).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on released PRs
        if: ${{ !inputs.dry_run && steps.history.outputs.pr_numbers != '' }}
        uses: actions/github-script@v9
        env:
          PR_NUMBERS: ${{ steps.history.outputs.pr_numbers }}
        with:
          script: |
            const pkg = '${{ needs.validate.outputs.package }}';
            const version = '${{ needs.validate.outputs.version }}';
            const tag = '${{ inputs.tag }}';
            const prNumbers = process.env.PR_NUMBERS.trim().split(/\s+/).map(Number);

            for (const number of prNumbers) {
              try {
                // Only comment on PRs that were actually merged
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: number
                });
                if (!pr.merged_at) continue;

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                  body: `🎉 **@jamiephan/${pkg}** \`v${version}\` has been published!\n\n` +
                        `This PR's changes are now available on npm.\n\n` +
                        `📦 Install: \`npm install @jamiephan/${pkg}@${version}\`\n` +
                        `🏷️ Release: [${tag}](https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag})`
                });
              } catch (error) {
                core.warning(`Could not comment on PR #${number}: ${error.message}`);
              }
            }

      - name: Summary
        shell: bash
        env:
          PACKAGE: ${{ needs.validate.outputs.package }}
          VERSION: ${{ needs.validate.outputs.version }}
          NPM_TAG: ${{ inputs.npm_tag }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "### 🧪 Dry Run Completed Successfully"
              echo ""
              echo "**Package:** \`@jamiephan/$PACKAGE\`"
              echo "**Version:** \`$VERSION\`"
              echo ""
              echo "✓ All platforms built and verified"
              echo "✓ Tarball packed and uploaded as the \`npm-tarball\` artifact"
              echo ""
              echo "Nothing was published, committed, tagged, or released."
            else
              echo "### ✅ Release Completed Successfully"
              echo ""
              echo "**Package:** \`@jamiephan/$PACKAGE\`"
              echo "**Version:** \`$VERSION\`"
              echo "**NPM Tag:** \`$NPM_TAG\`"
              echo "**Git Tag:** \`$TAG\`"
              echo ""
              echo "✓ Published to npm"
              echo "✓ Version bump committed and pushed"
              echo "✓ Git tag created and pushed"
              echo "✓ GitHub release created"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
